services:
  - type: web
    name: oani-omega-chess
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: oani-omega-memory
          property: connectionString
      - key: PGSSLMODE
        value: require

databases:
  - name: oani-omega-memory
    databaseName: oani_omega
    user: oani_omega
    plan: free
    region: singapore
